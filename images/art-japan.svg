<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b22"/>
      <stop offset="0.55" stop-color="#14204f"/>
      <stop offset="1" stop-color="#2b2a63"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4e0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff4e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4f8f"/>
      <stop offset="1" stop-color="#16214a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2556"/>
      <stop offset="1" stop-color="#060b20"/>
    </linearGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#c2352a"/>
    </linearGradient>
  </defs>
  <style>
    .star { fill: #dbe7ff; animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: -1s; } .s3 { animation-delay: -2s; }
    @keyframes twinkle { 50% { opacity: 0.2; } }
    .petal { animation: fall linear infinite; }
    @keyframes fall { from { transform: translate(0, -20px) rotate(0deg); } to { transform: translate(var(--drift), 540px) rotate(400deg); } }
    .mist { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translateX(26px); } }
    .lantern { animation: glow 2.6s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: 0.6; } }
    .tree { transform-origin: 420px 500px; animation: sway 6s ease-in-out infinite alternate; }
    @keyframes sway { to { transform: rotate(-1.2deg); } }
  </style>

