<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060f2c"/>
      <stop offset="0.55" stop-color="#16346c"/>
      <stop offset="0.86" stop-color="#3d5899"/>
      <stop offset="1" stop-color="#f29a6b"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb7e6"/>
      <stop offset="0.5" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#6f86bd"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd3ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tiers" width="8" height="9" patternUnits="userSpaceOnUse">
      <rect width="8" height="1.4" fill="#5a73ad"/>
    </pattern>
  </defs>
  <style>
    .fw * { opacity: 0; animation-duration: var(--t); animation-delay: var(--d); animation-iteration-count: infinite; }
    .trail { animation-name: rise; animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 4% { opacity: 1; } 26% { opacity: 1; transform: translateY(var(--rise)); } 30%, 100% { opacity: 0; transform: translateY(var(--rise)); } }
    .flash { animation-name: flash; transform-box: fill-box; transform-origin: center; }
    @keyframes flash { 0%, 27% { opacity: 0; transform: scale(0.2); } 30% { opacity: 0.9; transform: scale(1); } 40%, 100% { opacity: 0; transform: scale(1.6); } }
    .spark { animation-name: burst; animation-timing-function: cubic-bezier(0.1, 0.8, 0.3, 1); }
    @keyframes burst {
      0%, 28% { opacity: 0; transform: translate(0, 0); }
      31% { opacity: 1; }
      70% { opacity: 0.9; transform: translate(var(--x), calc(var(--y) + 10px)); }
      100% { opacity: 0; transform: translate(var(--x), calc(var(--y) + 34px)); }
    }
    .beacon { animation: pulse 2.4s ease-in-out infinite; }
    .halo { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .palm { transform-origin: 0 0; animation: sway 5s ease-in-out infinite alternate; }
    @keyframes sway { to { transform: rotate(3deg); } }
  </style>

